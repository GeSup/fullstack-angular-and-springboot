<div class="login-status-header">
  <div *ngIf="isAuthenticated" class="login-status-user-info">Welcome back {{ nickname }}</div>
  <button class="security-btn" *ngIf="!isAuthenticated" (click)="login()">Login</button>

  <button class="security-btn" *ngIf="isAuthenticated" (click)="logout()">Logout</button>

  <button *ngIf="isAuthenticated" routerLink="/members" class="security-btn ms-1">Member</button>

  <button *ngIf="isAuthenticated" routerLink="/order-history" class="security-btn ms-1">
    Orders
  </button>
</div>
